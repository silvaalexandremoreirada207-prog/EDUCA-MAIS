{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educa+ | Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-blue-700 min-h-screen flex items-center justify-center p-4">
    <div class="bg-blue-950 text-white rounded-3xl max-w-md w-full p-8 border-4 border-yellow-400 shadow-2xl">
        <div class="text-center mb-6">
            <div class="bg-yellow-400 text-blue-950 p-3 rounded-2xl inline-flex mb-3">
                <i class="fa-solid fa-user-plus text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black uppercase">Criar Conta</h1>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="bg-rose-900 text-rose-200 p-3 rounded-xl mb-4 text-sm border border-rose-700">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-black uppercase text-yellow-400 mb-1">Usuário</label>
                <input type="text" name="username" required
                    class="w-full bg-blue-900 border-2 border-blue-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-400">
            </div>
            <div>
                <label class="block text-xs font-black uppercase text-yellow-400 mb-1">Senha</label>
                <input type="password" name="password" required
                    class="w-full bg-blue-900 border-2 border-blue-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-400">
            </div>
            <div>
                <label class="block text-xs font-black uppercase text-yellow-400 mb-2">Tipo de conta</label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="cursor-pointer">
                        <input type="radio" name="tipo" value="aluno" class="peer sr-only" checked>
                        <div
                            class="bg-blue-900 border-2 border-blue-700 peer-checked:border-yellow-400 peer-checked:bg-blue-800 rounded-xl py-3 text-center text-xs font-black uppercase transition">
                            <i class="fa-solid fa-user-graduate mr-1"></i> Aluno
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="tipo" value="professor" class="peer sr-only">
                        <div
                            class="bg-blue-900 border-2 border-blue-700 peer-checked:border-yellow-400 peer-checked:bg-blue-800 rounded-xl py-3 text-center text-xs font-black uppercase transition">
                            <i class="fa-solid fa-chalkboard-user mr-1"></i> Professor
                        </div>
                    </label>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-yellow-400 hover:bg-yellow-500 text-blue-950 font-black py-3.5 rounded-xl uppercase tracking-wider transition">
                Cadastrar
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-blue-300">
            <a href="{% url 'landing' %}" class="hover:text-yellow-400">← Voltar para o início</a>
            <span class="mx-2">|</span>
            <a href="{% url 'login' %}" class="hover:text-yellow-400">Já tenho conta</a>
        </div>
    </div>
</body>

</html>
