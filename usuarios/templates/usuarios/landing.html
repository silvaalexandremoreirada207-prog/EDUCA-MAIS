{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educa+ | Escolha seu perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-blue-700 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-3xl w-full text-center">
        <div class="mb-12">
            <div
                class="bg-yellow-400 text-blue-950 p-4 rounded-3xl inline-flex items-center justify-center mb-4 shadow-xl border-4 border-yellow-200">
                <i class="fa-solid fa-graduation-cap text-4xl"></i>
            </div>
            <h1 class="text-5xl font-black text-white uppercase tracking-wider">
                Educa<span class="text-yellow-400">+</span>
            </h1>
            <p class="text-blue-200 mt-2 font-medium">Plataforma de cursos gratuitos</p>
        </div>

        <h2 class="text-2xl font-black text-white uppercase mb-6">Como você quer entrar?</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Cartão Aluno -->
            <a href="{% url 'login' %}?tipo=aluno"
                class="bg-blue-900 hover:bg-blue-800 border-4 border-yellow-400 rounded-3xl p-8 text-white transition group shadow-2xl block">
                <div class="text-yellow-400 text-5xl mb-4 group-hover:scale-110 transition">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <h3 class="text-2xl font-black uppercase mb-2">Sou Aluno</h3>
                <p class="text-blue-300 text-sm">Acesse seus cursos, favoritos e progresso.</p>
            </a>

            <!-- Cartão Professor -->
            <a href="{% url 'login' %}?tipo=professor"
                class="bg-blue-900 hover:bg-blue-800 border-4 border-yellow-400 rounded-3xl p-8 text-white transition group shadow-2xl block">
                <div class="text-yellow-400 text-5xl mb-4 group-hover:scale-110 transition">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>
                <h3 class="text-2xl font-black uppercase mb-2">Sou Professor</h3>
                <p class="text-blue-300 text-sm">Gerencie cursos e conteúdos da plataforma.</p>
            </a>
        </div>

        <p class="mt-8 text-blue-200">
            Ainda não tem conta?
            <a href="{% url 'cadastro' %}" class="text-yellow-400 font-bold hover:underline">Cadastre-se</a>
        </p>
    </div>
</body>

</html>
